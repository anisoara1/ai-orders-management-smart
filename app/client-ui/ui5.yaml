specVersion: "4.0"

metadata:
  name: ai.orders.client

type: application

framework:
  name: OpenUI5
  version: "1.136.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.ui.layout

server:
  customMiddleware:

    - name: ui5-middleware-index
      afterMiddleware: compression
      configuration:
        welcomeFile: index.html

    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /odata
      configuration:
        baseUri: https://ai-orders-management-smart.onrender.com/odata